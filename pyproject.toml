[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maestro-memory"
version = "0.3.0"
description = "Local-first memory for AI agents, backed by SQLite"
license = "MIT"
requires-python = ">=3.11"
readme = "README.md"
authors = [{name = "Maestro AI", email = "open-source@maestro.onl"}]
keywords = ["memory", "agents", "retrieval", "embeddings", "sqlite", "temporal", "act-r", "reranking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "httpx>=0.28",
    "numpy>=1.26",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.urls]
Homepage = "https://github.com/maestro-ai-stack/maestro-memory"
Repository = "https://github.com/maestro-ai-stack/maestro-memory.git"
Documentation = "https://github.com/maestro-ai-stack/maestro-memory/blob/master/docs/TECHNICAL.md"
"Bug Tracker" = "https://github.com/maestro-ai-stack/maestro-memory/issues"

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]
chinese = ["jieba>=0.42"]
ann = ["hnswlib>=0.8"]
mcp = ["mcp>=1.0"]
all = ["maestro-memory[local]", "maestro-memory[chinese]", "maestro-memory[ann]", "maestro-memory[mcp]"]
dev = ["build>=1.2", "pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "twine>=5.0"]

[project.scripts]
maestro-memory = "maestro_memory.cli:app"
mmem = "maestro_memory.cli:app"
mnerve = "maestro_memory.cli.mnerve:app"
mmem-mcp = "maestro_memory.mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/maestro_memory"]
artifacts = ["src/maestro_memory/py.typed"]

[tool.hatch.build.targets.wheel.force-include]
"src/maestro_memory/resources/com.maestro.memory.plist" = "maestro_memory/resources/com.maestro.memory.plist"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
